name: Toolkit stocks calendar

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./toolkit-stocks

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: toolkit-stocks/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py --phases calendar

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-calendar
          path: toolkit-stocks/run_summary.txt
          if-no-files-found: ignore
