name: Toolkit stocks daily

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./toolkit-stocks

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: toolkit-stocks/requirements.txt
      
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py --phases quote,overview,statements,prices,dividends,splits,fx,fa,fqs --symbols db

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary-daily
          path: toolkit-stocks/run_summary.txt
          if-no-files-found: ignore

      - name: Verify run
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f run_summary.txt ]; then
            python src/verify.py quote --log run_summary.txt
          else
            python src/verify.py quote
          fi
