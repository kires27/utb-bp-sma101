name: Toolkit stocks hourly prices

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./toolkit-stocks

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: toolkit-stocks/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Run hourly prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py --phases quote --symbols db
